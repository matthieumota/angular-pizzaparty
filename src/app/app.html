<h1>Hello {{ title() }}</h1>

<h2 (click)="pizza.set({ ...pizza(), name: 'toto' })">{{ pizza().name }}</h2>
<img
  [src]="pizza().image"
  [alt]="pizza().name + ' - Image'"
  (click)="firstname = 'Toto'"
>
<input [(ngModel)]="pizza().name" placeholder="name">
<input [value]="pizza().name" (input)="pizza.set({ ...pizza(), name: $event.target.value })">

{{ firstname }}

<router-outlet />
