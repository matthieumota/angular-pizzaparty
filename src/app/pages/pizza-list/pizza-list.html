<app-pizza-selected [default]="pizza()" />

<a routerLink="/pizza/new" class="bg-amber-300 px-2 py-1 rounded inline-flex">
  Créer une pizza
</a>

<ul class="grid grid-cols-4 gap-8">
  @for (p of pizzas(); track p.id) {
    <li
      [class.bg-gray-300]="pizza()?.id === p.id"
      (click)="onSelect(p)"
      [ngClass]="{
        'px-4 rounded-lg bg-gray-300!': pizza()?.id === p.id,
        'bg-red-300---': p.price > 11,
      }"
    >
      <span>{{ p.id }}: {{ p.name }}</span>
      <img [src]="p.image" [alt]="p.name" />
      @if (p.quantity) {
      <p>Vous avez {{ p.quantity }}</p>
      }
      <app-counter (changed)="updateQuantity($event, p)" />
      <a
        [routerLink]="['/pizzas', p.id]"
        class="bg-amber-300 px-2 py-1 rounded inline-flex"
      >
        Voir
      </a>
    </li>
  }
</ul>
