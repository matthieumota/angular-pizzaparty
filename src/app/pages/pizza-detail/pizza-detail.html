@if (pizza(); as pizza) {
  <div class="flex gap-4">
    <img [src]="pizza.image">
    <div>
      <h1 class="text-2xl">{{ pizza.name | uppercase }}</h1>
      <p>{{ pizza.price | currency:'EUR' }}</p>
      <a
        [routerLink]="['/pizza', pizza.id, 'edit']"
        class="bg-amber-300 px-2 py-1 rounded inline-flex"
      >
        Modifier
      </a>
    </div>
  </div>

  {{ pizza | json }}

  <a routerLink="/pizzas/2">2</a>
}
